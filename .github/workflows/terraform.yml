name: Terraform

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - "modules/argocd/bootstrap-chart/**"
      - "modules/workload-secrets/chart/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - "modules/argocd/bootstrap-chart/**"
      - "modules/workload-secrets/chart/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS || '["0.0.0.0/0"]' }}

jobs:
  pull-request-and-main-plan:
    name: Validate and plan (homolog)
    runs-on: ubuntu-latest
    environment: homolog
    env:
      TF_VAR_auth_db_password: ${{ secrets.HOMOLOG_AUTH_DB_PASSWORD }}
      TF_VAR_flags_db_password: ${{ secrets.HOMOLOG_FLAGS_DB_PASSWORD }}
      TF_VAR_targeting_db_password: ${{ secrets.HOMOLOG_TARGETING_DB_PASSWORD }}
      TF_VAR_auth_master_key: ${{ secrets.HOMOLOG_AUTH_MASTER_KEY }}
      TF_VAR_evaluation_service_api_key: ${{ secrets.HOMOLOG_EVALUATION_SERVICE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure AWS Academy LabRole
        env:
          CONFIGURED_LAB_ROLE_ARN: ${{ vars.LAB_ROLE_ARN }}
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          lab_role_arn="${CONFIGURED_LAB_ROLE_ARN:-arn:aws:iam::$account_id:role/LabRole}"

          if [[ ! "$lab_role_arn" =~ ^arn:aws[a-z-]*:iam::[0-9]{12}:role/LabRole$ ]]; then
            echo "::error::LAB_ROLE_ARN must reference the AWS Academy LabRole."
            exit 1
          fi

          echo "TF_VAR_lab_role_arn=$lab_role_arn" >> "$GITHUB_ENV"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: environments/homolog
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"

      - name: Terraform validate
        working-directory: environments/homolog
        run: terraform validate

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Terraform plan
        working-directory: environments/homolog
        run: terraform plan -no-color -out=tfplan

  apply:
    name: Apply (homolog)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pull-request-and-main-plan
    runs-on: ubuntu-latest
    environment: homolog
    env:
      TF_VAR_auth_db_password: ${{ secrets.HOMOLOG_AUTH_DB_PASSWORD }}
      TF_VAR_flags_db_password: ${{ secrets.HOMOLOG_FLAGS_DB_PASSWORD }}
      TF_VAR_targeting_db_password: ${{ secrets.HOMOLOG_TARGETING_DB_PASSWORD }}
      TF_VAR_auth_master_key: ${{ secrets.HOMOLOG_AUTH_MASTER_KEY }}
      TF_VAR_evaluation_service_api_key: ${{ secrets.HOMOLOG_EVALUATION_SERVICE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure AWS Academy LabRole
        env:
          CONFIGURED_LAB_ROLE_ARN: ${{ vars.LAB_ROLE_ARN }}
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          lab_role_arn="${CONFIGURED_LAB_ROLE_ARN:-arn:aws:iam::$account_id:role/LabRole}"

          if [[ ! "$lab_role_arn" =~ ^arn:aws[a-z-]*:iam::[0-9]{12}:role/LabRole$ ]]; then
            echo "::error::LAB_ROLE_ARN must reference the AWS Academy LabRole."
            exit 1
          fi

          echo "TF_VAR_lab_role_arn=$lab_role_arn" >> "$GITHUB_ENV"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: environments/homolog
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"

      - name: Terraform validate
        working-directory: environments/homolog
        run: terraform validate

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Terraform plan
        working-directory: environments/homolog
        run: terraform plan -no-color -out=tfplan

      - name: Terraform apply
        working-directory: environments/homolog
        run: terraform apply -auto-approve tfplan
