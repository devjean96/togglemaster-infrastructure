name: Terraform

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_VAR_lab_role_arn: ${{ vars.LAB_ROLE_ARN }}
  TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS || '["0.0.0.0/0"]' }}

jobs:
  pull-request-and-main-plan:
    name: Validate and plan (homolog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set database secrets
        shell: bash
        run: |
          echo "TF_VAR_auth_db_password=${{ secrets.HOMOLOG_AUTH_DB_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_flags_db_password=${{ secrets.HOMOLOG_FLAGS_DB_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_targeting_db_password=${{ secrets.HOMOLOG_TARGETING_DB_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: environments/homolog
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"

      - name: Terraform validate
        working-directory: environments/homolog
        run: terraform validate

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Terraform plan
        working-directory: environments/homolog
        run: terraform plan -no-color -out=tfplan

  apply:
    name: Apply (homolog)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pull-request-and-main-plan
    runs-on: ubuntu-latest
    environment: homolog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set database secrets
        shell: bash
        run: |
          echo "TF_VAR_auth_db_password=${{ secrets.HOMOLOG_AUTH_DB_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_flags_db_password=${{ secrets.HOMOLOG_FLAGS_DB_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_targeting_db_password=${{ secrets.HOMOLOG_TARGETING_DB_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: environments/homolog
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"

      - name: Terraform validate
        working-directory: environments/homolog
        run: terraform validate

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Terraform plan
        working-directory: environments/homolog
        run: terraform plan -no-color -out=tfplan

      - name: Terraform apply
        working-directory: environments/homolog
        run: terraform apply -auto-approve tfplan
