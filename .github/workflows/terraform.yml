name: Terraform

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.hcl"
      - "modules/argocd/bootstrap-chart/**"
      - "modules/workload-secrets/chart/**"
      - "modules/opentelemetry-collector/chart/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
      - feat/aws-temporary-demo
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.hcl"
      - "modules/argocd/bootstrap-chart/**"
      - "modules/workload-secrets/chart/**"
      - "modules/opentelemetry-collector/chart/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de implantacao e state
        required: true
        type: choice
        default: personal-demo
        options:
          - personal-demo
          - academy
      apply:
        description: Executar terraform apply depois do plan
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: ${{ ((github.event_name == 'workflow_dispatch' && inputs.profile == 'personal-demo') || (github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/feat/aws-temporary-demo')) && 'us-east-2' || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ ((github.event_name == 'workflow_dispatch' && inputs.profile == 'personal-demo') || (github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/feat/aws-temporary-demo')) && 'us-east-2' || 'us-east-1' }}
  PERSONAL_DEMO_AWS_ACCOUNT_ID: "335924543883"
  PERSONAL_DEMO_TERRAFORM_ROLE_ARN: arn:aws:iam::335924543883:role/ToggleMasterTerraformDemoRole
  PERSONAL_DEMO_STATE_REGION: us-east-2
  DEPLOYMENT_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || github.ref == 'refs/heads/feat/aws-temporary-demo' && 'personal-demo' || 'academy' }}
  TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS || '["0.0.0.0/0"]' }}
  TF_VAR_eks_https_egress_cidrs: ${{ vars.EKS_HTTPS_EGRESS_CIDRS || '["0.0.0.0/0"]' }}
  TF_VAR_ingress_load_balancer_source_ranges: ${{ vars.INGRESS_LOAD_BALANCER_SOURCE_RANGES || '["0.0.0.0/0"]' }}

jobs:
  pull-request-and-main-plan:
    name: Validate and plan
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.profile == 'personal-demo') || github.ref == 'refs/heads/feat/aws-temporary-demo') && 'personal-demo' || 'homolog' }}
    env:
      TF_VAR_auth_db_password: ${{ secrets.HOMOLOG_AUTH_DB_PASSWORD }}
      TF_VAR_flags_db_password: ${{ secrets.HOMOLOG_FLAGS_DB_PASSWORD }}
      TF_VAR_targeting_db_password: ${{ secrets.HOMOLOG_TARGETING_DB_PASSWORD }}
      TF_VAR_auth_master_key: ${{ secrets.HOMOLOG_AUTH_MASTER_KEY }}
      TF_VAR_evaluation_service_api_key: ${{ secrets.HOMOLOG_EVALUATION_SERVICE_API_KEY }}
      TF_VAR_newrelic_license_key: ${{ secrets.HOMOLOG_NEW_RELIC_LICENSE_KEY }}
      TF_VAR_grafana_admin_password: ${{ secrets.HOMOLOG_GRAFANA_ADMIN_PASSWORD }}
      TF_VAR_pagerduty_integration_key: ${{ secrets.HOMOLOG_PAGERDUTY_INTEGRATION_KEY }}
      TF_VAR_discord_webhook_url: ${{ secrets.HOMOLOG_DISCORD_WEBHOOK_URL }}
      TF_VAR_self_healer_token: ${{ secrets.HOMOLOG_SELF_HEALER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure personal-demo AWS credentials
        if: (github.event_name != 'push' || github.ref != 'refs/heads/feat/aws-temporary-demo') && env.DEPLOYMENT_PROFILE == 'personal-demo'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ env.PERSONAL_DEMO_TERRAFORM_ROLE_ARN }}
          role-session-name: togglemaster-${{ github.run_id }}-plan
          role-duration-seconds: 7200
          allowed-account-ids: ${{ env.PERSONAL_DEMO_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Configure AWS Academy credentials
        if: (github.event_name != 'push' || github.ref != 'refs/heads/feat/aws-temporary-demo') && env.DEPLOYMENT_PROFILE == 'academy'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        if: github.event_name != 'push' || github.ref != 'refs/heads/feat/aws-temporary-demo'
        run: aws sts get-caller-identity

      - name: Configure AWS Academy LabRole
        if: env.DEPLOYMENT_PROFILE == 'academy'
        env:
          CONFIGURED_LAB_ROLE_ARN: ${{ vars.LAB_ROLE_ARN }}
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          lab_role_arn="${CONFIGURED_LAB_ROLE_ARN:-arn:aws:iam::$account_id:role/LabRole}"

          if [[ ! "$lab_role_arn" =~ ^arn:aws[a-z-]*:iam::[0-9]{12}:role/LabRole$ ]]; then
            echo "::error::LAB_ROLE_ARN must reference the AWS Academy LabRole."
            exit 1
          fi

          echo "TF_VAR_lab_role_arn=$lab_role_arn" >> "$GITHUB_ENV"

      - name: Select Terraform profile and state
        shell: bash
        run: |
          case "$DEPLOYMENT_PROFILE" in
            academy)
              echo "TF_VAR_FILE=profiles/academy.tfvars" >> "$GITHUB_ENV"
              echo "TF_STATE_KEY=togglemaster/homolog/terraform.tfstate" >> "$GITHUB_ENV"
              ;;
            personal-demo)
              echo "TF_VAR_FILE=profiles/personal-demo.tfvars" >> "$GITHUB_ENV"
              echo "TF_STATE_KEY=togglemaster/personal-demo/homolog/terraform.tfstate" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported deployment profile: $DEPLOYMENT_PROFILE"
              exit 1
              ;;
          esac

      - name: Resolve Terraform backend
        if: github.event_name != 'push' || github.ref != 'refs/heads/feat/aws-temporary-demo'
        env:
          CONFIGURED_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        shell: bash
        run: |
          case "$DEPLOYMENT_PROFILE" in
            academy)
              state_bucket="$CONFIGURED_STATE_BUCKET"
              state_region="$AWS_REGION"
              ;;
            personal-demo)
              account_id="$(aws sts get-caller-identity --query Account --output text)"
              if [[ "$account_id" != "$PERSONAL_DEMO_AWS_ACCOUNT_ID" ]]; then
                echo "::error::personal-demo requires AWS account $PERSONAL_DEMO_AWS_ACCOUNT_ID, but the workflow authenticated as $account_id."
                exit 1
              fi
              state_bucket="togglemaster-terraform-state-${account_id}-${PERSONAL_DEMO_STATE_REGION}"
              state_region="$PERSONAL_DEMO_STATE_REGION"
              ;;
          esac

          if [[ ! "$state_bucket" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::Terraform state bucket is missing or invalid."
            exit 1
          fi

          echo "TF_STATE_BUCKET=$state_bucket" >> "$GITHUB_ENV"
          echo "TF_STATE_REGION=$state_region" >> "$GITHUB_ENV"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init with remote backend
        if: github.event_name != 'push' || github.ref != 'refs/heads/feat/aws-temporary-demo'
        working-directory: environments/homolog
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${TF_STATE_REGION}"

      - name: Terraform init for branch validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/aws-temporary-demo'
        working-directory: environments/homolog
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: environments/homolog
        run: terraform validate

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Terraform plan
        if: github.event_name != 'push' || github.ref != 'refs/heads/feat/aws-temporary-demo'
        working-directory: environments/homolog
        run: terraform plan -no-color -var-file="$TF_VAR_FILE" -out=tfplan

  apply:
    name: Apply (homolog)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.apply)
    needs: pull-request-and-main-plan
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.profile == 'personal-demo') || github.ref == 'refs/heads/feat/aws-temporary-demo') && 'personal-demo' || 'homolog' }}
    env:
      TF_VAR_auth_db_password: ${{ secrets.HOMOLOG_AUTH_DB_PASSWORD }}
      TF_VAR_flags_db_password: ${{ secrets.HOMOLOG_FLAGS_DB_PASSWORD }}
      TF_VAR_targeting_db_password: ${{ secrets.HOMOLOG_TARGETING_DB_PASSWORD }}
      TF_VAR_auth_master_key: ${{ secrets.HOMOLOG_AUTH_MASTER_KEY }}
      TF_VAR_evaluation_service_api_key: ${{ secrets.HOMOLOG_EVALUATION_SERVICE_API_KEY }}
      TF_VAR_newrelic_license_key: ${{ secrets.HOMOLOG_NEW_RELIC_LICENSE_KEY }}
      TF_VAR_grafana_admin_password: ${{ secrets.HOMOLOG_GRAFANA_ADMIN_PASSWORD }}
      TF_VAR_pagerduty_integration_key: ${{ secrets.HOMOLOG_PAGERDUTY_INTEGRATION_KEY }}
      TF_VAR_discord_webhook_url: ${{ secrets.HOMOLOG_DISCORD_WEBHOOK_URL }}
      TF_VAR_self_healer_token: ${{ secrets.HOMOLOG_SELF_HEALER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure personal-demo AWS credentials
        if: env.DEPLOYMENT_PROFILE == 'personal-demo'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ env.PERSONAL_DEMO_TERRAFORM_ROLE_ARN }}
          role-session-name: togglemaster-${{ github.run_id }}-apply
          role-duration-seconds: 7200
          allowed-account-ids: ${{ env.PERSONAL_DEMO_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Configure AWS Academy credentials
        if: env.DEPLOYMENT_PROFILE == 'academy'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure AWS Academy LabRole
        if: env.DEPLOYMENT_PROFILE == 'academy'
        env:
          CONFIGURED_LAB_ROLE_ARN: ${{ vars.LAB_ROLE_ARN }}
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          lab_role_arn="${CONFIGURED_LAB_ROLE_ARN:-arn:aws:iam::$account_id:role/LabRole}"

          if [[ ! "$lab_role_arn" =~ ^arn:aws[a-z-]*:iam::[0-9]{12}:role/LabRole$ ]]; then
            echo "::error::LAB_ROLE_ARN must reference the AWS Academy LabRole."
            exit 1
          fi

          echo "TF_VAR_lab_role_arn=$lab_role_arn" >> "$GITHUB_ENV"

      - name: Select Terraform profile and state
        shell: bash
        run: |
          case "$DEPLOYMENT_PROFILE" in
            academy)
              echo "TF_VAR_FILE=profiles/academy.tfvars" >> "$GITHUB_ENV"
              echo "TF_STATE_KEY=togglemaster/homolog/terraform.tfstate" >> "$GITHUB_ENV"
              ;;
            personal-demo)
              echo "TF_VAR_FILE=profiles/personal-demo.tfvars" >> "$GITHUB_ENV"
              echo "TF_STATE_KEY=togglemaster/personal-demo/homolog/terraform.tfstate" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported deployment profile: $DEPLOYMENT_PROFILE"
              exit 1
              ;;
          esac

      - name: Resolve Terraform backend
        env:
          CONFIGURED_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        shell: bash
        run: |
          case "$DEPLOYMENT_PROFILE" in
            academy)
              state_bucket="$CONFIGURED_STATE_BUCKET"
              state_region="$AWS_REGION"
              ;;
            personal-demo)
              account_id="$(aws sts get-caller-identity --query Account --output text)"
              if [[ "$account_id" != "$PERSONAL_DEMO_AWS_ACCOUNT_ID" ]]; then
                echo "::error::personal-demo requires AWS account $PERSONAL_DEMO_AWS_ACCOUNT_ID, but the workflow authenticated as $account_id."
                exit 1
              fi
              state_bucket="togglemaster-terraform-state-${account_id}-${PERSONAL_DEMO_STATE_REGION}"
              state_region="$PERSONAL_DEMO_STATE_REGION"
              ;;
          esac

          if [[ ! "$state_bucket" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::Terraform state bucket is missing or invalid."
            exit 1
          fi

          echo "TF_STATE_BUCKET=$state_bucket" >> "$GITHUB_ENV"
          echo "TF_STATE_REGION=$state_region" >> "$GITHUB_ENV"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: environments/homolog
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${TF_STATE_REGION}"

      - name: Terraform validate
        working-directory: environments/homolog
        run: terraform validate

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Terraform plan
        working-directory: environments/homolog
        run: terraform plan -no-color -var-file="$TF_VAR_FILE" -out=tfplan

      - name: Terraform apply
        working-directory: environments/homolog
        run: terraform apply -auto-approve tfplan
