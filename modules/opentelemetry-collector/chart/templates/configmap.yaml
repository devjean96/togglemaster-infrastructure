apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-config
  labels:
    {{- include "togglemaster-otel.labels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    {{- if .Values.prometheus.enabled }}
    connectors:
      # Fase 4: transforma cada span em metricas RED (Rate, Errors, Duration).
      # Mesma metrica para Go e Python -> dashboard e alerta padronizados.
      spanmetrics:
        namespace: traces.span.metrics
        metrics_flush_interval: 15s
        histogram:
          explicit:
            buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s]
        dimensions:
          - name: http.request.method
          - name: http.response.status_code
          - name: http.status_code
          - name: http.route
    {{- end }}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
        pod_association:
          - sources:
              - from: connection
      resource/togglemaster:
        attributes:
          - key: service.namespace
            value: togglemaster
            action: upsert
          - key: deployment.environment.name
            value: homolog
            action: upsert
      batch:
        send_batch_size: 512
        timeout: 5s

    exporters:
      otlphttp/newrelic:
        endpoint: {{ required "newRelic.endpoint is required" .Values.newRelic.endpoint | quote }}
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
        compression: gzip
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 1000
      {{- if .Values.prometheus.enabled }}
      # Receptor OTLP nativo do Prometheus 3 (flag --web.enable-otlp-receiver).
      otlphttp/prometheus:
        endpoint: {{ required "prometheus.otlpEndpoint is required" .Values.prometheus.otlpEndpoint | quote }}
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
      {{- end }}

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource/togglemaster, batch]
          exporters: [otlphttp/newrelic{{ if .Values.prometheus.enabled }}, spanmetrics{{ end }}]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource/togglemaster, batch]
          exporters: [otlphttp/newrelic]
        {{- if .Values.prometheus.enabled }}
        # Metricas RED geradas a partir dos traces -> Prometheus
        metrics/spanmetrics:
          receivers: [spanmetrics]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/prometheus]
        {{- end }}
