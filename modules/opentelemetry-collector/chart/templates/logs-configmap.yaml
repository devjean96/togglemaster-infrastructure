{{- if .Values.logs.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-logs-config
  labels:
    {{- include "togglemaster-otel.logsLabels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol
        create_directory: true

    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/{{ .Release.Namespace }}_opentelemetry-collector-logs-*_*/*/*.log
        start_at: end
        include_file_path: true
        storage: file_storage
        operators:
          - id: container-parser
            type: container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
          labels:
            - tag_name: service.name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: service.version
              key: app.kubernetes.io/version
              from: pod
            - tag_name: service.namespace
              key: app.kubernetes.io/part-of
              from: pod
            - tag_name: deployment.environment.name
              key: app.kubernetes.io/environment
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      transform/logs:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil
              - set(attributes["service.namespace"], attributes["k8s.namespace.name"]) where attributes["service.namespace"] == nil
              - set(attributes["deployment.environment.name"], "homolog") where attributes["deployment.environment.name"] == nil
      batch:
        send_batch_size: 512
        timeout: 5s

    exporters:
      otlphttp/loki:
        endpoint: {{ required "logs.lokiEndpoint is required" .Values.logs.lokiEndpoint | quote }}
        compression: gzip
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 1000

    service:
      extensions: [health_check, file_storage]
      telemetry:
        logs:
          level: info
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, transform/logs, batch]
          exporters: [otlphttp/loki]
{{- end }}
