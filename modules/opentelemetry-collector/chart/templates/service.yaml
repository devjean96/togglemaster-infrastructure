apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  labels:
    {{- include "togglemaster-otel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "togglemaster-otel.selectorLabels" . | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
