replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.164.0

newRelic:
  endpoint: https://otlp.nr-data.net
  licenseKey: ""

# Fase 4: metricas RED (spanmetrics) enviadas ao Prometheus instalado pelo ArgoCD.
prometheus:
  enabled: false
  otlpEndpoint: http://prometheus-server.observability.svc.cluster.local/api/v1/otlp

